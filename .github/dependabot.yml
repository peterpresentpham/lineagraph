# Weekly pull requests for outdated dependencies, grouped so a week's updates are one review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/admin]
    schedule:
      interval: weekly
